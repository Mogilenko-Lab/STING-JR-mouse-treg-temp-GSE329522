# analysis_config.yaml — language-agnostic project configuration
# Template version: 2.1.0
#
# This file holds ALL project-specific values that must NOT be hardcoded in
# analysis scripts. It is the cross-language data contract: both R and Python read it.
#
# Usage:
#   R:      config <- yaml::read_yaml("02_analysis/config/analysis_config.yaml")
#   Python: with open("02_analysis/config/analysis_config.yaml") as f: config = yaml.safe_load(f)

# =============================================================================
# PROJECT METADATA
# =============================================================================

project:
  id: "STING-cGAS-GSE329522"
  title: "STING-cGAS-GSE329522 Analysis"
  species: "Mus musculus"              # e.g. "Mus musculus" / "Homo sapiens"
  species_db: "MM"        # e.g. "MM" / "HS"
  genome_build: "mm10"    # e.g. "mm10", "mm39", "hg38"

# =============================================================================
# EXPERIMENTAL DESIGN
# =============================================================================

design:
  # 2x2 factorial: genotype {WT, cGASKO} x temperature {37, 39}, n=5/group.
  # Factor reference levels (set in 00_setup_metadata.R): genotype=WT, temp=37.
  groups:
    - "WT_37"
    - "cGASKO_37"
    - "WT_39"
    - "cGASKO_39"
  contrasts:
    # Per-genotype heat effect
    - name: "WT_heat"
      numerator: "WT_39"
      denominator: "WT_37"
    - name: "KO_heat"
      numerator: "cGASKO_39"
      denominator: "cGASKO_37"
    # Genotype x temperature interaction (difference of differences).
    # Written in the genotype-within-temperature form; ALGEBRAICALLY IDENTICAL to the
    # heat-within-genotype form (WT_39-WT_37)-(cGASKO_39-cGASKO_37) and to Geno_at_39 - Geno_at_37.
    # A balanced 2x2 has exactly one interaction df. A significant interaction = the heat
    # response is cGAS-dependent (predict: YES for the ISG/IFN arm, NO for the HIF/glycolysis arm).
    - name: "Interaction"
      formula: "(WT_39 - cGASKO_39) - (WT_37 - cGASKO_37)"
    # Genotype effect within each temperature (simple effects)
    - name: "Geno_at_39"
      numerator: "WT_39"
      denominator: "cGASKO_39"
    - name: "Geno_at_37"
      numerator: "WT_37"
      denominator: "cGASKO_37"
    # Pooled main effects. Temp_main = the average heat program (where the cGAS-INDEPENDENT
    # HIF/glycolysis arm should appear cleanly); Geno_main = the average cGAS effect.
    # Run decoupleR/PROGENy/GSEA on Temp_main as well as the per-genotype heat contrasts.
    - name: "Temp_main"
      formula: "0.5*(WT_39 + cGASKO_39) - 0.5*(WT_37 + cGASKO_37)"
    - name: "Geno_main"
      formula: "0.5*(WT_37 + WT_39) - 0.5*(cGASKO_37 + cGASKO_39)"
  samples_per_group: 5

  # Human-readable DISPLAY labels for each contrast — the single source of truth
  # for every figure title/caption (exposed by figure_style.R::contrast_label()).
  # The contrast KEYS above (WT_heat, Interaction, ...) stay the stable join keys
  # in 02_de_results.rds and every master CSV; these labels NEVER re-key the data.
  # `_short` variants (with an embedded newline) are for compact axis ticks.
  # House framing: the Interaction is LABELLED by what it TESTS (cGAS-dependence of
  # the heat response), not by a result — never read a label as a claim; floor at L3.
  contrast_labels:
    WT_heat:     "WT: heat (39 vs 37 °C)"
    KO_heat:     "cGAS-KO: heat (39 vs 37 °C)"
    Interaction: "Heat × genotype interaction (cGAS-dependence of the heat response)"
    Geno_at_37:  "Genotype (WT vs cGAS-KO) @ 37 °C"
    Geno_at_39:  "Genotype (WT vs cGAS-KO) @ 39 °C"
    Temp_main:   "Heat main effect (pooled genotypes)"
    Geno_main:   "Genotype main effect (pooled temps)"
  contrast_labels_short:
    WT_heat:     "WT heat\n(39 vs 37 °C)"
    KO_heat:     "cGAS-KO heat\n(39 vs 37 °C)"
    Interaction: "Interaction"
    Geno_at_37:  "Genotype\n@ 37 °C"
    Geno_at_39:  "Genotype\n@ 39 °C"
    Temp_main:   "Heat main\n(pooled)"
    Geno_main:   "Genotype main\n(pooled)"

# =============================================================================
# ANALYSIS THRESHOLDS
# =============================================================================

thresholds:
  # Differential Expression
  de_fdr: 0.05                        # FDR cutoff for significance
  de_logfc: 1.0                       # absolute log2FC cutoff (optional)

  # GSEA
  gsea_fdr: 0.05                      # FDR cutoff for pathway significance
  gsea_nperm: 100000                  # number of permutations
  gsea_seed: 123                      # random seed for reproducibility
  gsea_min_size: 15                   # minimum gene set size
  gsea_max_size: 500                  # maximum gene set size

# =============================================================================
# GSEA RUN PARAMETERS (clusterProfiler::GSEA, by="fgsea")
# =============================================================================
# The compute scripts (05/06) run clusterProfiler::GSEA so the cached objects are
# gseaResult S4 (consumable by the RNAseq-toolkit plotters). These keys pin the
# run-time engine settings; the per-set size bounds + nperm + seed live in
# thresholds: above (single source of truth).

gsea:
  rank_metric: "t"          # rank on the limma-trend t-statistic; NEVER logFC
  pvalue_cutoff_run: 1      # keep ALL pathways at run time; FDR-filter only at viz
  padj_method: "fdr"        # clusterProfiler::GSEA pAdjustMethod
  eps: 0                    # 0 => exact (machine-precision) fgsea p-values

# =============================================================================
# CORESH RUN PARAMETERS
# =============================================================================

coresh:
  species: mouse
  top_n_hits: 5
  min_query_size: 3
  n_cores: 4
  n_derive: 50
  # Query matrix = project signatures from the mouse-native signature-set object.
  query_signatures:
    object: 03_results/objects/17_signature_sets.rds
    # `origin` is the biological family label for the figure color strip (config, not row order).
    sets:
      - { contrast: WT_heat,     direction: up, gate: fdr_logfc, origin: "WT_heat_up (generic thermal)" }        # 213
      - { contrast: WT_heat,     direction: up, gate: fdr_only,  origin: "WT_heat_up (generic thermal)" }        # ~4207, broad
      - { contrast: Interaction, direction: up, gate: fdr_logfc, origin: "Interaction_up (cGAS-specific ISG)" }  # 9, core
      - { contrast: Interaction, direction: up, gate: fdr_only,  origin: "Interaction_up (cGAS-specific ISG)" }  # 23, gate-sensitivity

# =============================================================================
# COLOR PALETTES (colorblind-safe)
# =============================================================================

colors:
  # Okabe-Ito palette for categorical data
  okabe_ito:
    orange: "#E69F00"
    sky_blue: "#56B4E9"
    bluish_green: "#009E73"
    yellow: "#F0E442"
    blue: "#0072B2"
    vermillion: "#D55E00"
    reddish_purple: "#CC79A7"
    black: "#000000"

  # Diverging scale for NES, logFC (blue = down, orange = up)
  diverging:
    down: "#2166AC"
    neutral: "#F7F7F7"
    up: "#B35806"

  # Group colors for the 2x2 design (genotype x temperature)
  groups:
    WT_37: "#56B4E9"       # sky blue
    cGASKO_37: "#0072B2"   # blue
    WT_39: "#E69F00"       # orange
    cGASKO_39: "#D55E00"   # vermillion

# =============================================================================
# VISUALIZATION SETTINGS
# =============================================================================

visualization:
  width: 10
  height: 8
  width_narrow: 6                     # single column
  width_wide: 14                      # two columns
  dpi: 300                            # print quality
  base_size: 12
  title_size: 14
  label_size: 11
  n_top_pathways: 20                  # top pathways to show
  volcano_label_top: 10               # top genes to label

# =============================================================================
# FIGURES — the figure-style contract (read by figure_style.R)
# =============================================================================
# UNIFIED single-variant style (Wave-0 redesign, 2026-06-25): ONE legible theme,
# rendered to BOTH pdf + png from one code path — NO .print/.screen split, no suffix.
# Compact-but-legible: legible shrunk in a journal column AND projected to the back of
# a room. Font sizes are FLOORS — raise them, do not go under them. Colors are the
# centralized colorblind-safe `colors:` palette (okabe_ito / diverging / groups).

figures:
  # fonts (pt) — single tier
  base_size: 14
  title_size: 16
  subtitle_size: 11
  axis_title_size: 13
  axis_text_size: 11
  strip_size: 12
  legend_text_size: 11
  caption_size: 9
  label_size: 4                       # geom_text/geom_label size (ggplot mm)
  cue_size: 4                         # in-panel direction-cue text size
  line_width: 1.0                     # stronger trajectory/line contrast (was 0.8)
  point_size: 2.4
  # geometry (inches) — ONE canvas shared by the pdf + png
  width: 8.5
  height: 6.5
  width_wide: 13                      # two-column preset: save_figure(..., wide = TRUE)
  width_narrow: 6                     # single-column preset
  dpi: 300
  formats: [pdf, png]                 # both emitted for every figure (replaces variants:)
  # anti-clutter / comparability
  top_n: 20                           # cap categorical axes (pathways/genes) to top-N
  top_pathways: 20                    # top-N pathways per dotplot/facet/barplot (toolkit showCategory/top_n)
  running_sum_top: 5                  # # of curves per running-sum panel (top-N by |NES|)
  running_sum_ylim: [-1.0, 1.0]       # shared running-ES y-range so curves are comparable across DBs/contrasts
  volcano_label_top: 10
  z_clamp: 2.5
  nes_cap: 3.5
  caption_wrap_column: 70
  # results sub-layout directory names
  by_contrast_dir: "by_contrast"
  overview_dir: "_overview"

# =============================================================================
# DATABASES TO ANALYZE
# =============================================================================

databases:
  # Full 8-collection MSigDB sweep (matches house reference wl_subset/2.1_gsea.R).
  # GO:CC is especially apt for the mitochondrial-compartment mechanism.
  msigdb:
    - { category: "H",  subcategory: "",                name: "Hallmark" }
    - { category: "C2", subcategory: "CP:KEGG",         name: "KEGG" }
    - { category: "C2", subcategory: "CP:REACTOME",     name: "Reactome" }
    - { category: "C2", subcategory: "CP:WIKIPATHWAYS", name: "WikiPathways" }
    - { category: "C5", subcategory: "GO:BP",           name: "GO_BP" }
    - { category: "C5", subcategory: "GO:MF",           name: "GO_MF" }
    - { category: "C5", subcategory: "GO:CC",           name: "GO_CC" }
    - { category: "C3", subcategory: "TFT:GTRD",        name: "TF_Targets" }
  # Non-MSigDB databases, each run SEPARATELY (own GSEA call + own `database` tag).
  # Toolkit RDS are pre-converted to mouse symbols; the Lombardi set is curated in 00b
  # (protein-coding only, human->mouse via babelgene, provenance-stamped).
  custom:
    - name: "TransportDB"
      path: "01_modules/RNAseq-toolkit/data/references/transportdb/processed/Mus_musculus/transportdb_genesets.rds"
    - name: "MitoPathways"
      path: "01_modules/RNAseq-toolkit/data/references/mitocarta3.0/processed/Mus_musculus/mito_mitopathways.rds"
    - name: "MitoXplorer"
      path: "01_modules/RNAseq-toolkit/data/references/mitoxplorer3.0/processed/Mus_musculus/mito_mitoxplorer.rds"
    # Curation-INDEPENDENT HIF check: the PUBLISHED Lombardi 2022 48-gene consensus HIF
    # signature (doi:10.1016/j.celrep.2022.111652, Ratcliffe/Mole). Used as the orthogonal
    # HIF score in Phase 3 forensics + Phase 5 GSEA, and as the direct contrast to Phylo's
    # selectively-subset 16-gene list (shows what was dropped). Built by 00b_curate_lombardi_hif.R.
    - name: "Lombardi2022_HIF"
      path: "00_data/references/gene_sets/lombardi2022_hif_consensus_mouse.rds"
    # Curated heat-shock-response (HSR) thermal proteostasis lens — the biology-defined
    # second lens held orthogonal to the empirical WT_heat_up. Two terms: HSR_core (47 mouse,
    # cleaned cytosolic HSF1/chaperone core) and HSR_sensitivity (170 mouse, full union).
    # Built by 00d + 00e (msigdbr v2026.1.Hs, taxonomy-refined). Honest ceiling: proteotoxic-
    # stress-general, not fever-specific — only the 37/39 contrast measures thermal-ness.
    - name: "HSR_lens"
      path: "00_data/references/gene_sets/temp_hsr_lens/temp_hsr_mouse_lens.rds"
    # Tight TCR/IEG T-cell-activation lens — the "activation pole" of the three-lens
    # decomposition (66 mouse; TCR-proximal + costim-early + immediate-early TFs + activation
    # effectors), disjoint from the HSR core by construction. Built by 00f (agy web-researched
    # panel + curator refinement). Overlap of WT_heat_up with this = activation, not thermal.
    - name: "TCR_activation"
      path: "00_data/references/gene_sets/tcr_activation_lens/tcr_activation_mouse.rds"

# =============================================================================
# ANALYSIS STAGES
# =============================================================================
# Each stage owns 03_results/<id>/{tables,figures}/, created on first write.
# Stage id = NN_<slug>: zero-padded two-digit prefix + lowercase snake_case (<=2 words).
# Append a new entry here BEFORE any script writes artifacts to that stage.

stages:
  - id: "01_qc"
    title: "Quality control"
    purpose: "Filter cells/samples, flag doublets, gate on QC metrics."
  - id: "02_eda"
    title: "Exploratory analysis"
    purpose: "Embeddings, clustering, first-pass structure of the data."
  - id: "03_de"
    title: "Differential expression"
    purpose: "limma-trend 2x2 DE (~0 + group, eBayes trend+robust on log2 CPM); 5 contrasts with t-statistics."
  - id: "04_tf"
    title: "TF activity"
    purpose: "decoupleR ULM on CollecTRI plus DoRothEA HIF1a robustness forensics and run_consensus de-confounding."
  - id: "05_progeny"
    title: "PROGENy pathway activity"
    purpose: "decoupleR MLM on PROGENy (14 pathways); orthogonal Hypoxia-vs-immune split on the interaction."
  - id: "06_gsea"
    title: "GSEA sweep"
    purpose: "Ranked GSEA across MSigDB 8 collections (Hallmark/KEGG/Reactome/WikiPathways/GO_BP/MF/CC/TFT:GTRD) and custom DBs (TransportDB/MitoPathways/MitoXplorer/Lombardi2022_HIF), each separate."
  - id: "07_synthesis"
    title: "Synthesis and reply memo"
    purpose: "Assemble the two-arms panel and the claim-to-evidence reply memo; no new statistics."
  - id: "08_coresh"
    title: "CoReSh signature search"
    purpose: "Rank the public mmu compendium by coregulation of configured project signatures; GSEA on CoReSh-derived gene sets."
  - id: "09_gatom"
    title: "GATOM metabolic modules"
    purpose: "Atom-graph MWCS metabolic modules from the DE signal (MitoCarta-corroborating Complex-I / pseudohypoxia mechanism)."
  # --- Phase-0 mouse→human projection export (stage id != script number: scripts 17/18
  #     serve stages 10/11, matching the existing 12–16 → 06/07 offset). No new biology;
  #     reshape + ortholog-map master_de_genes.csv into the frozen human-projection contract.
  - id: "10_signature"
    title: "Projection signature derivation"
    purpose: "Derive per-contrast up/down gene sets + signed-t ranked lists (mouse symbols) from master_de_genes.csv at config thresholds; no new statistics."
  - id: "11_projection"
    title: "Human projection export"
    purpose: "Ortholog-map mouse→human (babelgene, pinned) and freeze the human-symbol projection contract under 03_results/human_projection/."
  - id: "12_hsr_decomp"
    title: "Heat-response three-lens decomposition"
    purpose: "Decompose the WT 39-vs-37 response into thermal HSR vs TCR/activation vs shared, using the curated HSR core, the TCR/IEG activation panel, and the empirical WT_heat_up; leading-edge attribution + gene overlap + rank concordance + competitive/conditional GSEA."

# =============================================================================
# INPUT/OUTPUT PATHS (relative to project root)
# =============================================================================

paths:
  # Input
  references: "00_data/references/"

  # Output roots — phase-based layout. Checkpoint state is separate from deliverables.
  results: "03_results/"              # results root
  objects: "03_results/objects/"      # reusable state (.h5ad, .rds) — NOT a deliverable
  master: "03_results/master/"        # cross-stage accumulator tables
  interactive: "03_results/interactive/"  # standalone HTML dashboards
  scratch: "03_results/_scratch/"     # throwaway plots/tables

  # Per-stage directories — <stage_id>/{tables,figures}/.
  # Resolve with the config loader (e.g. stage_dir("01_qc", "figures")); do not hardcode.
  stage_tables_subdir: "tables"
  stage_figures_subdir: "figures"

  # Toolkits
  rnaseq_toolkit: "01_modules/RNAseq-toolkit/"
  sciagent_toolkit: "01_modules/SciAgent-toolkit/"

# =============================================================================
# SCHEMA DEFINITIONS (for validation)
# =============================================================================

schemas:
  master_gsea_table:
    required_columns:
      - pathway_id
      - pathway_name
      - database
      - nes
      - pvalue
      - padj
      - set_size
      - core_enrichment
      - contrast
      - direction
  master_de_table:
    required_columns:
      - gene_symbol
      - logFC
      - P.Value
      - adj.P.Val
      - contrast
      - significant
      - direction

# =============================================================================
# DECISIONS — human sign-offs breakpoints
# =============================================================================
# Records human steering at a review breakpoint
# Re-run will end up at same choice defined in the notebook EDA. 
# Values here are inputs into the downstream numbered scripts read 
# Values here get hardcoded only after human review and exploration
# `status` gates the freeze: a compute stage that consumes a
# decision must refuse to run while status is PROPOSED_DEFAULT.

decisions:
  # BREAKPOINT 10 (after 17 compute+viz, before 18 freezes the contract): the human
  # approves WHICH contrasts to freeze, WHICH threshold gate, and HOW ortholog
  # ambiguity is resolved. Until sign-off these hold the plan DEFAULTS (runbook §3.1)
  # and 18_projection_export.R stops with status != APPROVED.
  projection:
    status: APPROVED                  # signed off at BREAKPOINT 10 (2026-07-03)
    # role=primary is the headline "mouse 39 °C Treg" axis; every other exported
    # contrast is role=comparator (the manifest `role` column).
    role_primary: ["WT_heat"]
    # The exact set of contrasts frozen as the export (the manifest rows). Default per
    # runbook §3.1: the primary axis + the three interpretable comparators.
    contrasts_primary: ["WT_heat", "KO_heat", "Interaction"]
    # Binary up/down gate. `fdr_logfc` = adj.P.Val < de_fdr AND |logFC| >= de_logfc (the
    # stringent config gate); `fdr_only` = adj.P.Val < de_fdr, |logFC| gate off (split by
    # DE direction). Ranked .rnk lists are ALWAYS the full signed-t list regardless.
    gate: fdr_logfc                   # fdr_only | fdr_logfc  (pending the review)
    # Collision policy for the mouse→human map (mirrors ortholog_utils::default_ortholog_policy).
    ortholog_ambiguity:
      one_mouse_to_many_human: union      # binary sets union; ranked list assigns t to each human
      many_mouse_to_one_human: max_abs_t  # ranked keeps max|t| per human; binary dedupe by union
      no_human_ortholog: drop             # dropped + logged (auditable)
      min_support: 3                      # babelgene::orthologs(min_support=)
      # Interaction is 1 df, underpowered at n=5; EDA-value 
      drop_interaction_if_trivial: true
      trivial_min_genes: 5
