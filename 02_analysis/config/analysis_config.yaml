# VISUALIZATION SETTINGS
# =============================================================================

visualization:
  width: 10
  height: 8
  width_narrow: 6                     # single column
  width_wide: 14                      # two columns
  dpi: 300                            # print quality
  base_size: 12
  title_size: 14
  label_size: 11
  n_top_pathways: 20                  # top pathways to show
  volcano_label_top: 10               # top genes to label

# =============================================================================
# FIGURES — the figure-style contract (read by figure_style.R)
# =============================================================================
# UNIFIED single-variant style (Wave-0 redesign, 2026-06-25): ONE legible theme,
# rendered to BOTH pdf + png from one code path — NO .print/.screen split, no suffix.
# Compact-but-legible: legible shrunk in a journal column AND projected to the back of
# a room. Font sizes are FLOORS — raise them, do not go under them. Colors are the
# centralized colorblind-safe `colors:` palette (okabe_ito / diverging / groups).

figures:
  # fonts (pt) — single tier
  base_size: 14
  title_size: 16
  subtitle_size: 11
  axis_title_size: 13
  axis_text_size: 11
  strip_size: 12
  legend_text_size: 11
  caption_size: 9
  label_size: 4                       # geom_text/geom_label size (ggplot mm)
  cue_size: 4                         # in-panel direction-cue text size
  line_width: 1.0                     # stronger trajectory/line contrast (was 0.8)
  point_size: 2.4
  # geometry (inches) — ONE canvas shared by the pdf + png
  width: 8.5
  height: 6.5
  width_wide: 13                      # two-column preset: save_figure(..., wide = TRUE)
  width_narrow: 6                     # single-column preset
  dpi: 300
  formats: [pdf, png]                 # both emitted for every figure (replaces variants:)
  # anti-clutter / comparability
  top_n: 20                           # cap categorical axes (pathways/genes) to top-N
  top_pathways: 20                    # top-N pathways per dotplot/facet/barplot (toolkit showCategory/top_n)
  running_sum_top: 5                  # # of curves per running-sum panel (top-N by |NES|)
  running_sum_ylim: [-1.0, 1.0]       # shared running-ES y-range so curves are comparable across DBs/contrasts
  # y label for a running sum's bottom panel: the statistic the ranking was built on. These
  # rankings are limma-trend moderated t (config.R RANK_METRIC = "t"), and the human
  # compartments label the same axis with the same words, so a panel here and a panel there
  # read against each other.
  metric_axis_label: "Moderated t"
  volcano_label_top: 10
  z_clamp: 2.5
  # Symmetric limit for diverging NES fills. Kept fixed rather than per-contrast so one
  # colour means one NES in every panel, and set tight to the observed range across the
  # pooled family (max |NES| = 3.145) so the colourbar does not advertise end-colours no
  # point attains. scales::squish still guards anything beyond it.
  nes_cap: 3.2
  caption_wrap_column: 70
  # results sub-layout directory names
  by_contrast_dir: "by_contrast"
  overview_dir: "_overview"

# =============================================================================
# SYMBOL ALIAS RESOLUTION
# =============================================================================
# The collaborators' delivered CPM table was quantified against GRCm38 + GENCODE vM25, so
# this project's vocabulary is frozen to that build's MGI vintage: 2,341 of the 19,679
# modelled symbols are no longer current official MGI symbols. Reference gene sets ship
# CURRENT symbols. Exact string matching therefore drops genes that are present, and the
# loss reads as absence. The whole ATP-synthase block is the worst case — the matrix
# carries Atp5a1 … Atpif1 while MitoCarta 3.0 ships Atp5f1a … Atp5po, so
# MITOPATHWAYS_OXPHOS.Complex_V matched 7 of its 22 genes, fell under gsea_min_size, and
# was absent from master_gsea_table.csv entirely.
#
# TWO DIRECTIONS, TWO MECHANISMS, and conflating them is the mistake to avoid:
#   gene sets   reference symbol (newer) -> matrix symbol (older).
#               helpers/symbol_alias.R::build_alias_map, applied at 04_gsea_set_prep.R.
#   orthology   matrix symbol (older) -> current symbol (newer), because babelgene keys on
#               current MGI. helpers/ortholog_utils.R::normalise_mouse_query, applied
#               inside build_ortholog_map at 18_projection_export.R.
# The one-to-one safety condition means something different in each direction, which is why
# they are separate functions with separate flagged-pair lists.

symbol_alias:
  # The committed asset. Regenerable by 02_analysis/scripts/00_symbol_alias_map.R, so it is
  # negated out of the 00_data/references/* ignore rule rather than left untracked —
  # regenerating it must produce a reviewable diff.
  map_path: "00_data/references/symbol_alias/symbol_alias_map.csv"
  provenance_path: "00_data/references/symbol_alias/symbol_alias_provenance.csv"

  # The vocabulary reference symbols are resolved INTO: the modelled DE universe, which in
  # this project is also every symbol the delivered CPM table carries (19,679 either way —
  # the duplicate-symbol collapse at 01_mapping_qc.R drops Ensembl ids, never symbols).
  # There is consequently exactly ONE vocabulary layer here, so n_expression_filtered is
  # structurally 0 and absence means "not in the delivered quantification".
  matrix_vocabulary: "03_results/objects/gene_universe.txt"
  quantified_vocabulary: "00_data/processed/GSE329522_normalized_counts_CPM_iTreg.csv"
  quantified_vocabulary_column: "gene_name"

  # Pairs the one-to-one + ownership guards accept but a human declined, so they are
  # recorded as flagged_for_review and NEVER applied. Both are the same two decisions seen
  # from the two directions, and they are listed twice because the pair strings differ.
  #   Ndufb1 / Ndufb1-ps  the matrix row is pseudogene-suffixed. Attaching a curated NDUFB1
  #                       set member to it, or handing it NDUFB1's human ortholog, is a
  #                       judgement about the vM25 annotation and not about nomenclature.
  #   H2ac25 / H2aw       histone cluster renaming is many-to-many; the one-to-one
  #                       condition passing here is close to accidental.
  flagged_for_review:
    - "Ndufb1->Ndufb1-ps"
    - "H2ac25->H2aw"
  ortholog_query_flagged_for_review:
    - "Ndufb1-ps->Ndufb1"
    - "H2aw->H2ac25"

# =============================================================================
# DATABASES TO ANALYZE
# =============================================================================

databases:
  # Full 8-collection MSigDB sweep (matches house reference wl_subset/2.1_gsea.R).
  # GO:CC is especially apt for the mitochondrial-compartment mechanism.
  msigdb:
    - { category: "H",  subcategory: "",                name: "Hallmark" }
    - { category: "C2", subcategory: "CP:KEGG",         name: "KEGG" }
    - { category: "C2", subcategory: "CP:REACTOME",     name: "Reactome" }
    - { category: "C2", subcategory: "CP:WIKIPATHWAYS", name: "WikiPathways" }
    - { category: "C5", subcategory: "GO:BP",           name: "GO_BP" }
    - { category: "C5", subcategory: "GO:MF",           name: "GO_MF" }
    - { category: "C5", subcategory: "GO:CC",           name: "GO_CC" }
    - { category: "C3", subcategory: "TFT:GTRD",        name: "TF_Targets" }
  # Non-MSigDB databases, each run SEPARATELY (own GSEA call + own `database` tag).
  # Toolkit RDS are pre-converted to mouse symbols.
  custom:
    - name: "TransportDB"
      path: "01_modules/RNAseq-toolkit/data/references/transportdb/processed/Mus_musculus/transportdb_genesets.rds"
    - name: "MitoPathways"
      path: "01_modules/RNAseq-toolkit/data/references/mitocarta3.0/processed/Mus_musculus/mito_mitopathways.rds"
    - name: "MitoXplorer"
      path: "01_modules/RNAseq-toolkit/data/references/mitoxplorer3.0/processed/Mus_musculus/mito_mitoxplorer.rds"
    # Curated heat-shock-response (HSR) thermal proteostasis lens — the biology-defined
    # second lens held orthogonal to the empirical WT_heat_up. Two terms: HSR_core (47 mouse,
    # cleaned cytosolic HSF1/chaperone core) and HSR_sensitivity (170 mouse, full union).
    # Built by 00d + 00e (msigdbr v2026.1.Hs, taxonomy-refined). Honest ceiling: proteotoxic-
    # stress-general, not fever-specific — only the 37/39 contrast measures thermal-ness.
    - name: "HSR_lens"
      path: "00_data/references/gene_sets/temp_hsr_lens/temp_hsr_mouse_lens.rds"
    # Tight TCR/IEG T-cell-activation lens — the "activation pole" of the three-lens
    # decomposition (66 mouse; TCR-proximal + costim-early + immediate-early TFs + activation
    # effectors), disjoint from the HSR core by construction. Built by 00f (agy web-researched
    # panel + curator refinement). Overlap of WT_heat_up with this = activation, not thermal.
    - name: "TCR_activation"
      path: "00_data/references/gene_sets/tcr_activation_lens/tcr_activation_mouse.rds"

# =============================================================================
# ANALYSIS STAGES
# =============================================================================
# Each stage owns 03_results/<id>/{tables,figures}/, created on first write.
# Stage id = NN_<slug>: zero-padded two-digit prefix + lowercase snake_case (<=2 words).
# Append a new entry here BEFORE any script writes artifacts to that stage.

stages:
  - id: "01_qc"
    title: "Quality control"
    purpose: "Filter cells/samples, flag doublets, gate on QC metrics."
  - id: "02_eda"
    title: "Exploratory analysis"
    purpose: "Embeddings, clustering, first-pass structure of the data."
  - id: "03_de"
    title: "Differential expression"
    purpose: "limma-trend 2x2 DE (~0 + group, eBayes trend+robust on log2 CPM); 5 contrasts with t-statistics."
  - id: "04_tf"
    title: "TF activity"
    purpose: "decoupleR ULM on CollecTRI plus DoRothEA HIF1a robustness forensics and run_consensus de-confounding."
  - id: "05_progeny"
    title: "PROGENy pathway activity"
    purpose: "decoupleR MLM on PROGENy (14 pathways); orthogonal Hypoxia-vs-immune split on the interaction."
  - id: "06_gsea"
    title: "GSEA sweep"
    purpose: "Ranked GSEA across MSigDB 8 collections (Hallmark/KEGG/Reactome/WikiPathways/GO_BP/MF/CC/TFT:GTRD) and custom DBs (TransportDB/MitoPathways/MitoXplorer/HSR_lens/TCR_activation), each separate."
  - id: "07_synthesis"
    title: "Synthesis and reply memo"
    purpose: "Assemble the two-arms panel and the claim-to-evidence reply memo; no new statistics."
  - id: "08_coresh"
    title: "CoReSh signature search"
    purpose: "Rank the public mmu compendium by coregulation of configured project signatures; GSEA on CoReSh-derived gene sets."
  - id: "09_gatom"
    title: "GATOM metabolic modules"
    purpose: "Atom-graph MWCS metabolic modules from the DE signal (MitoCarta-corroborating Complex-I / pseudohypoxia mechanism)."
  # --- Phase-0 mouse→human projection export (stage id != script number: scripts 17/18
  #     serve stages 10/11, matching the existing 12–16 → 06/07 offset). No new biology;
  #     reshape + ortholog-map master_de_genes.csv into the frozen human-projection contract.
  - id: "10_signature"
    title: "Projection signature derivation"
    purpose: "Derive per-contrast up/down gene sets + signed-t ranked lists (mouse symbols) from master_de_genes.csv at config thresholds; no new statistics."
  - id: "11_projection"
    title: "Human projection export"
    purpose: "Ortholog-map mouse→human (babelgene, pinned) and freeze the human-symbol projection contract under 03_results/human_projection/."
  - id: "12_hsr_decomp"
    title: "Heat-response three-lens decomposition"
    purpose: "Decompose the WT 39-vs-37 response into thermal HSR vs TCR/activation vs shared, using the curated HSR core, the TCR/IEG activation panel, and the empirical WT_heat_up; leading-edge attribution + gene overlap + rank concordance + competitive/conditional GSEA."
  # --- Ontology-side composition of the same gate set. Stage 12 asks what fraction of
  #     WT_heat_up falls inside curated lenses (a binary membership question, and 191 of
  #     213 fall outside all four). This stage asks a different question of the same 213
  #     genes using GO BP semantic similarity: how internally coherent is the set, can it
  #     be split into modules at all, and for the genes no lens contains, how close does
  #     each one's annotation sit to each lens. Nothing here reads expression, so the
  #     partition can never be derived from an enrichment.
  - id: "13_semantic_decomp"
    title: "Semantic composition of the projection gate set"
    purpose: "GO BP semantic-similarity composition of WT_heat_up (GOSemSim Wang/BMA): annotation coverage ladder, set coherence against annotation-depth-matched and single-GO-term references, partition diagnostics, and graded per-gene proximity to each curated lens with depth-stratified background percentiles."
  # --- Bench-facing readback of the exported up arms. Stages 10/11 report a signature as
  #     a COUNT (213 mouse -> 199 human); the bench asks the gene-level question those
  #     counts hide: for each member gene, what is its expression level in each of the four
  #     design cells, and how much of its across-group variation sits on the heat axis
  #     versus the genotype axis. No new statistics — the DE numbers are read from the
  #     finished master and the expression from the frozen 01_eda log2 CPM matrix.
  - id: "14_signature_expression"
    title: "Signature-gene expression across the 2x2 design"
    purpose: "Per-gene group-mean log2 CPM (+/- sd/se) and across-group z for every member of the exported up arms (WT_heat_up, KO_heat_up, Interaction_up at fdr_logfc plus Interaction_up at fdr_only), carrying each gene's source-contrast DE statistics and its mouse->human ortholog fate; substrate for the wet-lab dot plot."
  # --- Candidate-list-free composition of the same up arms. Stage 12 and the human
  #     compartment's arm-decomposition both ask "how much of the arm is in THIS lens?"
  #     from a hand-picked panel that already contains the answer they are looking for,
  #     and two thirds of WT_heat_up lands in no panel member at all. This stage asks the
  #     ontology instead: over-representation of the WHOLE GO Biological Process (and
  #     Molecular Function) space against the projection background the arm was selected
  #     from, so the candidate space is not curated by the person asking the question.
  #     Over-representation is new machinery here: every other enrichment in this repo is
  #     pre-ranked GSEA.
  - id: "15_go_decomposition"
    title: "Ontology-wide over-representation composition of the projected up arms"
    purpose: "Whole-ontology GO BP (+ MF) over-representation of each mouse-derived human-projected up arm against the 12,986-symbol projection background, run with and without IEA-derived annotation; an annotation-depth-matched permutation null beside the hypergeometric p-value; Wang-similarity redundancy collapse at two levels; a GO-term-versus-curated-lens gene-block comparison; a three-way per-gene coverage split; and an explicit searched-and-absent probe of the proteostasis terms a heat-shock reading would predict."
  - id: "16_arm_composition"
    title: "What fraction of each projected arm each pathway accounts for"
    purpose: "Over-representation of each human-projected arm across five frozen MSigDB collections (Hallmark, GO BP, GO MF, KEGG, Reactome) on the shared 12,986-symbol background, selecting sets by a 2,000-replicate annotation-depth-matched permutation rather than by adjusted p and dropping any whose significance recurs in more than a quarter of matched draws; redundancy pruned on shared arm genes; attribution written both fractionally and winner-take-all so their disagreement is visible, each summing to the arm size exactly; a hypoxia-anchored variant reported beside the unpinned one with pinned sets that never reached significance marked as such; and a coverage null recording how many drawn genes a matched random set covers."

# =============================================================================
# INPUT/OUTPUT PATHS (relative to project root)
# =============================================================================

paths:
  # Input
  references: "00_data/references/"

  # Output roots — phase-based layout. Checkpoint state is separate from deliverables.
  results: "03_results/"              # results root
  objects: "03_results/objects/"      # reusable state (.h5ad, .rds) — NOT a deliverable
  master: "03_results/master/"        # cross-stage accumulator tables
  interactive: "03_results/interactive/"  # standalone HTML dashboards
  scratch: "03_results/_scratch/"     # throwaway plots/tables

  # Per-stage directories — <stage_id>/{tables,figures}/.
  # Resolve with the config loader (e.g. stage_dir("01_qc", "figures")); do not hardcode.
  stage_tables_subdir: "tables"
  stage_figures_subdir: "figures"

  # Toolkits
  rnaseq_toolkit: "01_modules/RNAseq-toolkit/"
  sciagent_toolkit: "01_modules/SciAgent-toolkit/"

  # Project-local R library, for packages that must differ from the container's
  # system library. It is OPT-IN: sourcing config.R does not touch .libPaths().
  # A script that needs it calls use_project_rlib() before its library() calls,
  # and every other script keeps the system library untouched. Contents are
  # rebuildable and are not tracked; see 02_analysis/config/env/r_library.md.
  r_library: "01_modules/Rlib/"

# =============================================================================
# SCHEMA DEFINITIONS (for validation)
# =============================================================================

schemas:
  master_gsea_table:
    required_columns:
      - pathway_id
      - pathway_name
      - database
      - nes
      - pvalue
      - padj
      - set_size
      - core_enrichment
      - contrast
      - direction
  master_de_table:
    required_columns:
      - gene_symbol
      - logFC
      - P.Value
      - adj.P.Val
      - contrast
      - significant
      - direction

# =============================================================================
# DECISIONS — human sign-offs breakpoints
# =============================================================================
# Records human steering at a review breakpoint
# Re-run will end up at same choice defined in the notebook EDA. 
# Values here are inputs into the downstream numbered scripts read 
# Values here get hardcoded only after human review and exploration
# `status` gates the freeze: a compute stage that consumes a
# decision must refuse to run while status is PROPOSED_DEFAULT.

decisions:
  # BREAKPOINT 10 (after 17 compute+viz, before 18 freezes the contract): the human
  # approves WHICH contrasts to freeze, WHICH threshold gate, and HOW ortholog
  # ambiguity is resolved. Until sign-off these hold the plan DEFAULTS (runbook §3.1)
  # and 18_projection_export.R stops with status != APPROVED.
  projection:
    status: APPROVED                  # signed off at BREAKPOINT 10 (2026-07-03)
    # role=primary is the headline "mouse 39 °C Treg" axis; every other exported
    # contrast is role=comparator (the manifest `role` column).
    role_primary: ["WT_heat"]
    # The exact set of contrasts frozen as the export (the manifest rows). Default per
    # runbook §3.1: the primary axis + the three interpretable comparators.
    #
    # The three heat contrasts are linearly dependent by construction:
    #   WT_heat      = full thermal response in cGAS-competent cells   (the primary axis)
    #   Interaction  = WT_heat - KO_heat = the cGAS-DEPENDENT slice     (ISG/STING candidate)
    #   KO_heat      = WT_heat - Interaction = the cGAS-INDEPENDENT thermal comparator
    # so WT_heat = KO_heat + Interaction and any two of the three fix the third. We still
    # materialize KO_heat as its own scored contrast because it plays an independent role
    # the other two cannot: at the cross-dataset integration layer it is the NEGATIVE /
    # specificity control scored against the SAVI STING gain-of-function reference — if it
    # overlaps SAVI much as WT_heat does, the heat<->SAVI overlap is STING-INDEPENDENT
    # (IFN-like), keeping the human read correlative. Inside a single human disease dataset
    # the story is intentionally TWO threads only (WT_heat + Interaction); KO_heat is not
    # scored there because KO = WT - Interaction is already implied by the other two.
    contrasts_primary: ["WT_heat", "KO_heat", "Interaction"]
    # Binary up/down gate. `fdr_logfc` = adj.P.Val < de_fdr AND |logFC| >= de_logfc (the
    # stringent config gate); `fdr_only` = adj.P.Val < de_fdr, |logFC| gate off (split by
    # DE direction). Ranked .rnk lists are ALWAYS the full signed-t list regardless.
    gate: fdr_logfc                   # fdr_only | fdr_logfc  (pending the review)
    # Thin comparator contrasts also exported at a SECOND (looser) gate for gate-sensitivity.
    # Interaction is 1 df / thin at fdr_logfc; carry its fdr_only variant alongside so the
    # human side can score both the 7-gene core and the ~23-gene gate-sensitivity set.
    #
    # Gate asymmetry is BY DESIGN, not a smell. Interaction and KO_heat are the two arms of
    # the same specificity test, not competitors. Interaction rides the looser fdr_only gate
    # because it is the underpowered POSITIVE candidate — a 1-df interaction term is inherently
    # low-power and needs the sensitivity read to avoid a false null. KO_heat rides the
    # stringent combo fdr_logfc gate (the top-level `gate:` above) with NO secondary gate
    # because it is the well-powered NEGATIVE control and needs no rescue: a well-powered null
    # is a strong null.
    secondary_gate: fdr_only
    secondary_gate_contrasts: ["Interaction"]
    # Collision policy for the mouse→human map (mirrors ortholog_utils::default_ortholog_policy).
    ortholog_ambiguity:
      one_mouse_to_many_human: union      # binary sets union; ranked list assigns t to each human
      many_mouse_to_one_human: max_abs_t  # ranked keeps max|t| per human; binary dedupe by union
      no_human_ortholog: drop             # dropped + logged (auditable)
      min_support: 3                      # babelgene::orthologs(min_support=)
      # Interaction is 1 df, underpowered at n=5; EDA-value 
      drop_interaction_if_trivial: true
      trivial_min_genes: 5

# =============================================================================
# arm_composition -- what fraction of each arm each pathway accounts for
# =============================================================================
# Why this stage exists, given 15_go_decomposition already runs over-representation.
#
# 15_go_decomposition answers "which terms does this arm's gene content organise into".
# It does NOT support a composition figure, and its own numbers say why: 386 enriched
# GO BP terms for WT_heat_up produce 972 module-memberships over a union of 159 genes,
# a 6.1-fold double count, with only 21 of 199 genes in exactly one module. A stacked
# bar built on that draws 972 gene-slots for 159 genes.
#
# The existing hand-picked nine-lens decomposition has the opposite problem: it is close
# to a partition (100 memberships over 67 genes) but its panel was chosen by whoever was
# asking, and it leaves 132 of 199 genes unclaimed.
#
# This stage keeps the partition property and drops the hand-picked panel. Sets come from
# five frozen MSigDB collections; selection is by depth-matched permutation rather than by
# adjusted p; redundant sets are pruned on how much of the ARM they share, not on set
# similarity in general; and attribution is reported two ways so a reader can see whether
# the composition is determined at all.
arm_composition:
  # --- inputs -----------------------------------------------------------------
  # Same arms and same background as go_decomposition, deliberately: the two stages must
  # be readable against each other term for term.
  arms_from: "go_decomposition"
  background_from: "go_decomposition"

  # The frozen collections the HUMAN compartment's sweep already used, consumed as an
  # object rather than rebuilt from msigdbr here. Rebuilding would risk the mouse-side
  # "HALLMARK_HYPOXIA" and the human-side one meaning different things if msigdbr data
  # drifted between runs; sharing the frozen object makes the two sides comparable set
  # for set. The content hash is recorded in provenance and a change to it is visible.
  genesets_object: "../human_treg_arthritis/03_results/objects/14_genesets.rds"
  collections: ["Hallmark", "GO_BP", "GO_MF", "KEGG", "Reactome"]

  # --- test -------------------------------------------------------------------
  # enricher() defaults, matching go_decomposition so rows are comparable.
  p_cutoff: 0.05
  q_cutoff: 0.2
  p_adjust_method: "BH"
  min_gs_size: 10
  max_gs_size: 500

  # --- selection --------------------------------------------------------------
  # Sets enter the composition only if a depth-matched random gene set of the same size
  # and annotation depth reaches their adjusted p less than p_matched_cutoff of the time.
  # This is the step that makes the figure robust: in 15_go_decomposition only 188 of 386
  # enriched GO BP terms clear it, and the MEDIAN enriched term does not.
  p_matched_cutoff: 0.05
  # Terms whose own significance recurs in more than this fraction of matched replicates
  # are dropped even if p_matched clears, because a category a random set finds half the
  # time cannot carry a share of a signature. In 15_go_decomposition the five terms that
  # would have headlined the figure recur at 0.281 to 0.628.
  max_null_recurrence: 0.25
  # Redundancy prune. Two sets that claim nearly the same ARM genes cannot both carry a
  # share, so the less significant one is dropped. Overlap is measured on the arm's hit
  # genes rather than on the whole sets, because hit overlap is what double counts in the
  # bar; whole-set Jaccard is recorded alongside for audit.
  prune_hit_jaccard: 0.5
  top_n_per_collection: 10

  # --- attribution ------------------------------------------------------------
  # Both are written and both are plotted. `fractional` answers "how much of the arm does
  # this category account for" and sums to the arm size exactly. `winner_take_all` gives a
  # true partition by assigning each gene to its single best set. Where the two disagree
  # materially the composition is not determined, and that disagreement is the result.
  accountings: ["fractional", "winner_take_all"]

  # --- the hypoxia-anchored variant -------------------------------------------
  # Reported BESIDE the unbiased variant, never instead of it. History: an earlier
  # revision of the pooled GSEA overview force-included the Hallmark hypoxia and
  # interferon sets regardless of rank, which made that panel argue for a conclusion, and
  # the pin was removed. Pinning here is legitimate only because the anchored panel is
  # labelled as anchored and the unbiased panel is published next to it.
  #
  # Named explicitly rather than matched by pattern: a regex on "HIF" also catches
  # GOBP_VIRAL_TRANSLATIONAL_FRAMESHIFTING, which is how a pin becomes a silent error.
  # Two of the five collections carry no hypoxia set at all, and the stage reports that
  # as an absence of opportunity rather than as a zero share.
  hypoxia_anchor:
    Hallmark:  ["HALLMARK_HYPOXIA"]
    Reactome:  ["REACTOME_CELLULAR_RESPONSE_TO_HYPOXIA"]
    GO_BP:     ["GOBP_RESPONSE_TO_OXYGEN_LEVELS", "GOBP_CELLULAR_RESPONSE_TO_OXYGEN_LEVELS",
                "GOBP_HYPOXIA_INDUCIBLE_FACTOR_1ALPHA_SIGNALING_PATHWAY"]
    KEGG:      []
    GO_MF:     []

  # --- null -------------------------------------------------------------------
  # Same engine and same band quantiles as go_decomposition. n_null is per arm and per
  # collection. The null additionally records, per replicate, how many of the DRAWN genes
  # fall in at least one set reaching significance, which go_decomposition does not: that
  # is the missing null for any coverage or share claim.
  n_null: 2000
  depth_band_quantiles: [0.2, 0.4, 0.55, 0.7, 0.8, 0.875, 0.94, 0.98]
  seed: 20260731
