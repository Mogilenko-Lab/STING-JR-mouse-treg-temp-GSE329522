# analysis_config.yaml — language-agnostic project configuration
# Template version: 2.1.0
#
# This file holds ALL project-specific values that must NOT be hardcoded in
# analysis scripts. It is the cross-language data contract: both R and Python read it.
#
# Usage:
#   R:      config <- yaml::read_yaml("02_analysis/config/analysis_config.yaml")
#   Python: with open("02_analysis/config/analysis_config.yaml") as f: config = yaml.safe_load(f)

# =============================================================================
# PROJECT METADATA
# =============================================================================

project:
  id: "STING-cGAS-GSE329522"
  title: "STING-cGAS-GSE329522 Analysis"
  species: "Mus musculus"              # e.g. "Mus musculus" / "Homo sapiens"
  species_db: "MM"        # e.g. "MM" / "HS"
  genome_build: "mm10"    # e.g. "mm10", "mm39", "hg38"

# =============================================================================
# EXPERIMENTAL DESIGN
# =============================================================================

design:
  # 2x2 factorial: genotype {WT, cGASKO} x temperature {37, 39}, n=5/group.
  # Factor reference levels (set in 00_setup_metadata.R): genotype=WT, temp=37.
  groups:
    - "WT_37"
    - "cGASKO_37"
    - "WT_39"
    - "cGASKO_39"
  contrasts:
    # Per-genotype heat effect
    - name: "WT_heat"
      numerator: "WT_39"
      denominator: "WT_37"
    - name: "KO_heat"
      numerator: "cGASKO_39"
      denominator: "cGASKO_37"
    # Genotype x temperature interaction (difference of differences).
    # Written in the genotype-within-temperature form; ALGEBRAICALLY IDENTICAL to the
    # heat-within-genotype form (WT_39-WT_37)-(cGASKO_39-cGASKO_37) and to Geno_at_39 - Geno_at_37.
    # A balanced 2x2 has exactly one interaction df. A significant interaction = the heat
    # response is cGAS-dependent (predict: YES for the ISG/IFN arm, NO for the HIF/glycolysis arm).
    - name: "Interaction"
      formula: "(WT_39 - cGASKO_39) - (WT_37 - cGASKO_37)"
    # Genotype effect within each temperature (simple effects)
    - name: "Geno_at_39"
      numerator: "WT_39"
      denominator: "cGASKO_39"
    - name: "Geno_at_37"
      numerator: "WT_37"
      denominator: "cGASKO_37"
    # Pooled main effects. Temp_main = the average heat program (where the cGAS-INDEPENDENT
    # HIF/glycolysis arm should appear cleanly); Geno_main = the average cGAS effect.
    # Run decoupleR/PROGENy/GSEA on Temp_main as well as the per-genotype heat contrasts.
    - name: "Temp_main"
      formula: "0.5*(WT_39 + cGASKO_39) - 0.5*(WT_37 + cGASKO_37)"
    - name: "Geno_main"
      formula: "0.5*(WT_37 + WT_39) - 0.5*(cGASKO_37 + cGASKO_39)"
  samples_per_group: 5

  # Sample-to-condition assignment provenance — the single source of truth for every
  # figure stamp and README caption that states how the library -> condition mapping
  # was established. Read these keys; never restate the status as a literal string in
  # a script, because that is how a stale hedge outlives the evidence for it.
  #
  # Exposed by config.R::sample_mapping_status(), ::sample_mapping_stamp() (short, for
  # a figure canvas) and ::sample_mapping_caption() (long, for a README caption).
  # 00_setup_metadata.R writes `status` into every row of
  # 03_results/master/sample_metadata.csv. Full account, including the per-library
  # table: 00_data/processed/PROVENANCE.md.
  #
  # Scope of the confirmation: it covers the sample -> condition mapping and nothing
  # else. It is not a statement about power, effect size, or any claim tier.
  sample_mapping:
    status: "CONFIRMED"            # CONFIRMED | INFERRED
    source: "owner sample sheet"
    confirmed_on: "2026-07-22"
    concordant: 20                 # libraries whose label-blind call matched the sheet
    total: 20
    # Short form for a figure canvas. Detail belongs in the README caption.
    stamp: "Sample mapping owner-confirmed (GSE329522 iTreg 2x2 genotype x temperature)"
    # Long form for a README caption.
    caption: "Sample-to-condition mapping confirmed against the owner's sample sheet (2026-07-22): 20 of 20 libraries concordant with the label-blind marker call."
    # Rendered only if `status` is ever set back to INFERRED.
    stamp_unconfirmed: "Sample mapping inferred from marker expression, pending the owner sample sheet"
    caption_unconfirmed: "Claim tier: PROVISIONAL (pending collaborator sample sheet)."

  # Human-readable DISPLAY labels for each contrast — the single source of truth
  # for every figure title/caption (exposed by figure_style.R::contrast_label()).
  # The contrast KEYS above (WT_heat, Interaction, ...) stay the stable join keys
  # in 02_de_results.rds and every master CSV; these labels NEVER re-key the data.
  # `_short` variants (with an embedded newline) are for compact axis ticks.
  # House framing: the Interaction is LABELLED by what it TESTS (cGAS-dependence of
  # the heat response), not by a result — never read a label as a claim; floor at L3.
  contrast_labels:
    WT_heat:     "WT: heat (39 vs 37 °C)"
    KO_heat:     "cGAS-KO: heat (39 vs 37 °C)"
    Interaction: "Heat × genotype interaction (cGAS-dependence of the heat response)"
    Geno_at_37:  "Genotype (WT vs cGAS-KO) @ 37 °C"
    Geno_at_39:  "Genotype (WT vs cGAS-KO) @ 39 °C"
    Temp_main:   "Heat main effect (pooled genotypes)"
    Geno_main:   "Genotype main effect (pooled temps)"
  contrast_labels_short:
    WT_heat:     "WT heat\n(39 vs 37 °C)"
    KO_heat:     "cGAS-KO heat\n(39 vs 37 °C)"
    Interaction: "Interaction"
    Geno_at_37:  "Genotype\n@ 37 °C"
    Geno_at_39:  "Genotype\n@ 39 °C"
    Temp_main:   "Heat main\n(pooled)"
    Geno_main:   "Genotype main\n(pooled)"

# =============================================================================
# ANALYSIS THRESHOLDS
# =============================================================================

thresholds:
  # Differential Expression
  de_fdr: 0.05                        # FDR cutoff for significance
  de_logfc: 1.0                       # absolute log2FC cutoff (optional)

  # GSEA
  gsea_fdr: 0.05                      # FDR cutoff for pathway significance
  gsea_nperm: 100000                  # number of permutations
  gsea_seed: 123                      # random seed for reproducibility
  gsea_min_size: 15                   # minimum gene set size
  gsea_max_size: 500                  # maximum gene set size

# =============================================================================
# GSEA RUN PARAMETERS (clusterProfiler::GSEA, by="fgsea")
# =============================================================================
# The compute scripts (05/06) run clusterProfiler::GSEA so the cached objects are
# gseaResult S4 (consumable by the RNAseq-toolkit plotters). These keys pin the
# run-time engine settings; the per-set size bounds + nperm + seed live in
# thresholds: above (single source of truth).

gsea:
  rank_metric: "t"          # rank on the limma-trend t-statistic; NEVER logFC
  pvalue_cutoff_run: 1      # keep ALL pathways at run time; FDR-filter only at viz
  padj_method: "fdr"        # clusterProfiler::GSEA pAdjustMethod
  eps: 0                    # 0 => exact (machine-precision) fgsea p-values

# =============================================================================
# SEMANTIC-SIMILARITY COMPOSITION (GOSemSim; stage 13_semantic_decomp)
# =============================================================================
# Wang similarity is graph-based on the GO DAG and needs no corpus IC, so it does
# not shift when the annotation corpus is updated. BMA (best-match average) is the
# gene-level combiner: a gene carries many terms and BMA scores each term against
# its best partner, so a gene is not penalised for breadth.
#
# depth_bands is the load-bearing parameter. The gate that produced WT_heat_up
# thresholds effect size, which selects well-studied genes: on curated evidence its
# members carry a median 9 GO BP terms against the expressed background's 4.
# A better-annotated gene has more chances to sit near any reference set, so every
# null here matches the query's terms-per-gene distribution band by band, and every
# percentile is taken within a gene's own band. The uniform null is computed too,
# and reported beside the matched one, to show the size of that confound rather
# than to support any claim.

semantic:
  ontology: "BP"                  # BP carries process semantics; MF/CC do not
  measure: "Wang"                 # graph-based, IC-free, corpus-stable
  combine: "BMA"                  # gene-level best-match average, term-count weighted
  # GOSemSim's gene-level entry points drop electronically inferred annotations by
  # default and this stage follows that. It is also the conservative choice here:
  # poorly studied genes lean on IEA more than well studied ones, so keeping it would
  # narrow the measured depth gap for a reason that has nothing to do with biology.
  drop_evidence: ["IEA"]
  seed: 20260728
  # Wang weights a parent edge by its relationship: is_a 0.8, part_of 0.6, other 0.7.
  # GOSemSim through 2.36.0 keys that table on "is_a"/"part_of" and matches it against
  # the packaged `gotbl`, which spells them "isa"/"part of", so all 66,947 BP edges take
  # the 0.7 "other" weight and the measure loses the distinction it is made of.
  # `expect_isa_weight` is asserted BEHAVIOURALLY at run time, not read off the version
  # string: for a BP term whose only gotbl parent is an is_a edge to the BP root, Wang
  # similarity to that root is (1+w)/(2+w), so the run recovers w and stops if it is not
  # this value. The recovered number is written to semantic_provenance.csv, so the table
  # proves which weighting produced the numbers beside it.
  expect_isa_weight: 0.8
  # Builds known to carry the fix. Advisory only; the behavioural assert is the gate,
  # because the fix reached the devel branch (2.39.x) first and a release-branch build
  # carrying it would be numbered differently.
  known_fixed_gosemsim: ["2.39.2"]
  depth_bands: [0, 3, 6, 10, 15, 22, 32, 50]   # terms-per-gene strata; open upper bin
  n_null_uniform: 20              # uniform-random size-matched sets (confounded; shown)
  n_null_matched: 20              # annotation-depth-matched sets (the honest floor)
  n_theme_subsamples: 5           # subsamples per oversized single-term reference
  bg_sample_size: 2000            # background genes for lens-proximity percentiles
  max_k_partition: 15             # silhouette sweep upper bound
  # Single-GO-term reference sets, used as the coherent end of the coherence scale.
  # Chosen to span a tight process and progressively broader ones, so the scale has
  # interior points and not only a ceiling.
  theme_references:
    - "GO:0009408"                # response to heat
    - "GO:0006986"                # response to unfolded protein
    - "GO:0034976"                # response to endoplasmic reticulum stress
    - "GO:0001666"                # response to hypoxia
    - "GO:0006954"                # inflammatory response

# =============================================================================
# POOLED-FDR GSEA OVERVIEW PANEL (stage 06_gsea, figures/_overview/)
# =============================================================================
# Display contract for the faceted lollipop overview built by
# 12b_gsea_overview_pooled_viz.R. These keys govern the FIGURE only: the pooled
# Benjamini-Hochberg family computed by 06b_gsea_pooled_padj.R is unchanged and
# still spans every database listed under `databases:` below.
#
# `exclude_databases` drops a database from the PANEL, never from the pooled
# family, the GSEA sweep, or the results tables. It is currently empty.
#
# The Lombardi2022_HIF database used to be listed here, and it has since been
# removed from this stage entirely rather than only from the panel: the set is no
# longer built by 04_gsea_set_prep.R or scored by 06_gsea_custom_run.R, and its
# rows and figures are gone from 03_results/06_gsea/ and from the master tables.
# The reason is fit, not behaviour. It is a pan-cancer consensus derived under
# hypoxia in cancer cells, which is the wrong reference for a 39 °C in-vitro
# contrast in iTregs, and it meets WT_heat_up at 7 of that arm's 213 genes
# (3.3%; see mouse_anchor/03_results/12_hsr_decomp/README.md). Hypoxia in this
# stage is now read off the curated, versioned collections instead, which is what
# 28_hypoxia_focus_viz.R draws.
#
# The curation script 00b_curate_lombardi_hif.R and its outputs under
# 00_data/references/gene_sets/ stay. They still feed the curated comparison lens
# used by 19_hsr_decomposition_viz.R and by the semantic decomposition, which read
# the set from 00_data and never from this stage.
#
# `top_n_per_db` is the ONLY per-facet selection knob: sets are ranked by pooled
# BH FDR (ties broken by the raw p-value, then by |NES|) and the top N per
# database are drawn. No semantic, thematic or manual pinning is layered on top —
# an earlier revision force-included Hallmark HYPOXIA/INTERFERON sets and the
# three project-curated lenses regardless of rank, which quietly made the panel
# argue for a conclusion; that pin is gone.

gsea_pooled_overview:
  top_n_per_db: 5              # sets drawn per database facet, ranked by padj_pooled
  exclude_databases:           # dropped from the PANEL only (see note above)
  label_wrap: 38               # wrap column for set names on the y axis (never truncate)
  facet_ncol: 2                # 2 columns keeps long set names legible at width_wide
  # Inches per set row. 0.36 rather than 0.30 because set names wrap to two lines in
  # the long-named families (WikiPathways, Reactome, GO_CC) and at 0.30 four
  # consecutive two-line labels run into each other.
  facet_row_height: 0.36
  facet_strip_height: 0.34     # inches per facet strip
  chrome_height: 3.4           # inches for title + subtitle + axis + legend + caption

# =============================================================================
# CORESH RUN PARAMETERS
# =============================================================================

coresh:
  species: mouse
  top_n_hits: 5
  min_query_size: 3
  n_cores: 4
  n_derive: 50
  # Query matrix = project signatures from the mouse-native signature-set object.
  query_signatures:
    object: 03_results/objects/17_signature_sets.rds
    # `origin` is the biological family label for the figure color strip (config, not row order).
    sets:
      - { contrast: WT_heat,     direction: up, gate: fdr_logfc, origin: "WT_heat_up (generic thermal)" }        # 213
      - { contrast: WT_heat,     direction: up, gate: fdr_only,  origin: "WT_heat_up (generic thermal)" }        # ~4207, broad
      - { contrast: Interaction, direction: up, gate: fdr_logfc, origin: "Interaction_up (cGAS-specific ISG)" }  # 9, core
      - { contrast: Interaction, direction: up, gate: fdr_only,  origin: "Interaction_up (cGAS-specific ISG)" }  # 23, gate-sensitivity

# =============================================================================
# SIGNATURE-GENE EXPRESSION READBACK (stage 14_signature_expression)
# =============================================================================
# UP ARMS ONLY, and that is a scope decision rather than an omission. The bench
# question this stage serves — "show me the genes that go UP with heat and whether
# cGAS matters" — is asked of the induced arm; the down arms carry a separate
# interpretive burden (in the human compartment the down arm's direction does not
# replicate cleanly) and mixing them into one dot plot would invite reading a
# two-headed panel as one program. Down arms are therefore absent from this stage's
# tables, figures and prose by design.
#
# `Interaction_up_fdrOnly` rides alongside `Interaction_up` because the stringent
# gate leaves the interaction arm at 9 genes: too thin to read a pattern from. It is
# the SAME 1-df contrast at the looser gate (adj.P.Val only, |logFC| gate off), it is
# flagged as such in every table row and facet label, and it is a sensitivity read —
# never a second, larger interaction signature.
#
# `top_n_genes` caps the plotted rows per facet only; both tables carry every member.
# It is 15, not 25, for a legibility reason that is worth writing down. The figure lays the
# four arms out 2x2 rather than 4-across, because the canvas WIDTH is what gets normalised
# when a reader views the PNG at notebook width (~1150 px): 4 panels side by side force a
# 17-inch canvas, at which the gene labels render around 9 px and stop being readable, while
# 2 columns fit the project default 8.5-inch width and render them near 19 px. That fixes the
# width; `top_n_genes` then fixes the height, since 2 panel rows stack their gene rows. At 15
# the figure is ~8.5 x 10.5 in — legible at notebook width AND shrinkable into a journal page.
# The cost is one arm: Interaction_up_fdrOnly has 23 members, so it is the only signature the
# cap truncates (the strip label says "top 15 of 23"). Interaction_up (9) stays complete, and
# both tables carry every member of every arm regardless.

signature_expression:
  # Read from the mouse-native signature-set checkpoint, in this display order.
  # `name` is the signature label carried in every output row (and the facet label);
  # `source_contrast` is the DE contrast whose logFC/t/adj.P.Val the gene is ranked on.
  source_object: "03_results/objects/17_signature_sets.rds"
  signatures:
    - { name: "WT_heat_up",             source_contrast: "WT_heat",     direction: up, gate: fdr_logfc }   # 213
    - { name: "KO_heat_up",             source_contrast: "KO_heat",     direction: up, gate: fdr_logfc }   # 239
    - { name: "Interaction_up",         source_contrast: "Interaction", direction: up, gate: fdr_logfc }   # 9
    - { name: "Interaction_up_fdrOnly", source_contrast: "Interaction", direction: up, gate: fdr_only }    # 23, sensitivity read
  expression_object: "03_results/objects/01_eda.rds"
  expression_matrix: "logcpm_mat"       # log2 CPM; the matrix every group mean is taken on
  ortholog_map: "03_results/human_projection/ortholog_map.tsv"   # the APPLIED frozen map
  projection_manifest: "03_results/human_projection/manifest.csv" # frozen ledger, cross-checked
  top_n_genes: 15                       # plotted rows per signature facet (tables are complete)
  facet_ncol: 2                         # 2x2 layout — keeps the canvas at the default 8.5in width
  # ggplot point-size range for mean log2 CPM. The FLOOR is 1.8 rather than 1.2 because the
  # scarcest plotted genes are the interaction-arm ISGs, and at notebook display width a 1.2
  # dot is a few pixels — the reader would lose exactly the points the panel exists to show.
  # The CEILING is 6.5 rather than 7.0 so the largest dots in the two abundant heat panels
  # keep visible air between adjacent gene rows.
  dot_size_range: [1.8, 6.5]

# =============================================================================
# ONTOLOGY-WIDE OVER-REPRESENTATION (stage 15_go_decomposition)
# =============================================================================
# Every other enrichment in this project is pre-ranked GSEA. This block configures the
# only over-representation test in the repo, and it exists because a decomposition run
# against a hand-picked list of candidate programs can only return candidates from that
# list. Here the candidate space is the whole ontology.
#
# background is load-bearing. The arm was SELECTED from the projection ranked list, so
# that list — not a generic all-genes set — is the universe the selection happened in.
# Using anything wider would credit the arm with enrichment that is really the
# mouse->human ortholog map's coverage.
#
# The depth-matched null is not a duplicate of the hypergeometric p-value. The gate that
# produced these arms thresholds effect size, which preferentially admits well-studied
# genes; the hypergeometric conditions on set size and universe only. Measured here:
# uniform-random size-matched sets of the projection background return a MEDIAN OF ZERO
# BH-significant BP terms, while sets matched to the arm's terms-per-gene profile return
# hundreds. Any term's p-value must therefore be read against the matched null, not
# against the uniform expectation the hypergeometric assumes.

go_decomposition:
  # --- inputs -----------------------------------------------------------------
  # The arms, in human projection space. `role: primary` is the headline axis; the rest
  # are comparators and carry no privilege in any table.
  arms:
    - { name: "WT_heat_up",             role: "primary",
        file: "03_results/human_projection/signatures/WT_heat/WT_heat_up.txt" }
    - { name: "KO_heat_up",             role: "comparator",
        file: "03_results/human_projection/signatures/KO_heat/KO_heat_up.txt" }
    - { name: "Interaction_up",         role: "comparator",
        file: "03_results/human_projection/signatures/Interaction/Interaction_up.txt" }
    - { name: "Interaction_fdrOnly_up", role: "comparator",
        file: "03_results/human_projection/signatures/Interaction/Interaction_fdrOnly_up.txt" }
  # Column 1 of the projection ranked list: the 12,986 human symbols the arms were
  # selected from, carried across the same frozen ortholog map.
  background: "03_results/human_projection/signatures/WT_heat/WT_heat_ranked.rnk"
  orgdb: "org.Hs.eg.db"

  # --- test -------------------------------------------------------------------
  # MF rides alongside BP and is never pooled with it: the two ontologies are separate
  # multiple-testing families and separate tables. MF is here for a specific coverage
  # reason — P4HA2, a canonical HIF target, carries no GO BP term at all and is only
  # visible in MF (2-oxoglutarate-dependent dioxygenase activity), so a BP-only read
  # would silently call it un-annotated.
  ontologies: ["BP", "MF"]
  primary_ontology: "BP"
  # Both cutoffs are clusterProfiler::enrichGO's own defaults, kept so a reader can
  # reproduce any row with a one-line call. "Enriched" below always means BOTH gates:
  # raw p and BH-adjusted p under p_cutoff, and the Storey q under q_cutoff.
  p_cutoff: 0.05
  q_cutoff: 0.2
  p_adjust_method: "BH"
  min_gs_size: 10
  max_gs_size: 500

  # --- the IEA decision, taken explicitly and tested both ways -----------------
  # enrichGO includes electronically inferred (IEA) annotation; stage 13_semantic_decomp
  # deliberately drops it. Neither default is obviously right here, so both are run and
  # both are reported. with_iea is PRIMARY because it is the canonical clusterProfiler
  # path a reader reproduces in one line, and because the study-depth confound that
  # motivates dropping IEA is handled directly by the depth-matched null below rather
  # than by an evidence filter. If the headline terms move between the two variants,
  # that is a finding and the stage README says so.
  iea_variants: ["with_iea", "no_iea"]
  primary_iea: "with_iea"
  drop_evidence: ["IEA"]

  # --- redundancy collapse, two levels ----------------------------------------
  # Both run under GOSemSim from the project-local R library. The system build (2.36.0)
  # collapses every BP parent edge to a uniform 0.7 Wang weight because GO.db spells the
  # relationships "isa"/"part of" while getSV keys on "is_a"/"part_of"; 2.39.2 normalises
  # them first. Any simplify() or pairwise_termsim() call inherits that, so this stage
  # stops rather than fall back to the system build.
  sim_measure: "Wang"
  simplify_cutoff: 0.7
  simplify_by: "p.adjust"
  cluster_linkage: "average"
  cluster_height: 0.7         # cut the (1 - Wang) dendrogram here for the block assignment

  # --- annotation-depth-matched permutation null -------------------------------
  # n_null is 2000, not the 20 stage 13 could afford: a hit count and a share both scale
  # with n, so the p-value floor of a small null (1/21) is not usable for either. The set
  # arithmetic is a sparse matrix product, so 2000 costs seconds.
  seed: 20260730
  n_null: 2000
  null_ontologies: ["BP"]     # the null is computed for the primary ontology only
  # Depth = the number of ontology terms the gene carries in the SAME propagated map the
  # test uses, so the band is the gene's actual number of chances to be a hit. Band edges
  # are background quantiles rather than the fixed counts stage 13 used on the direct
  # (unpropagated) map, because the propagated distribution is an order of magnitude
  # wider (background median 52 terms per gene, WT_heat_up median 100).
  depth_band_quantiles: [0.2, 0.4, 0.55, 0.7, 0.8, 0.875, 0.94, 0.98]

  # --- GO term versus curated lens, gene block against gene block ---------------
  # Every curated lens the human compartment's arm-decomposition panel uses, each paired
  # with the GO term whose NAME a reader would take to mean the same thing. The point of
  # the pairing is that the two disagree about which genes they claim, so the pair is
  # reported as three counts (GO only / shared / lens only) and three gene lists. A GO id
  # that is absent from the installed GO.db is reported as an absent row, not skipped.
  curated_lenses:
    - { name: "HALLMARK_HYPOXIA",                 go_id: "GO:0001666",
        file: "../human_treg_arthritis/00_data/references/msigdb_hallmark/HALLMARK_HYPOXIA.txt" }
    - { name: "HALLMARK_TNFA_SIGNALING_VIA_NFKB", go_id: "GO:0007249",
        file: "../human_treg_arthritis/00_data/references/msigdb_hallmark/HALLMARK_TNFA_SIGNALING_VIA_NFKB.txt" }
    - { name: "HALLMARK_INFLAMMATORY_RESPONSE",   go_id: "GO:0006954",
        file: "../human_treg_arthritis/00_data/references/msigdb_hallmark/HALLMARK_INFLAMMATORY_RESPONSE.txt" }
    - { name: "HALLMARK_IL2_STAT5_SIGNALING",     go_id: "GO:0038110",
        file: "../human_treg_arthritis/00_data/references/msigdb_hallmark/HALLMARK_IL2_STAT5_SIGNALING.txt" }
    - { name: "HALLMARK_INTERFERON_ALPHA_RESPONSE", go_id: "GO:0035455",
        file: "../human_treg_arthritis/00_data/references/msigdb_hallmark/HALLMARK_INTERFERON_ALPHA_RESPONSE.txt" }
    - { name: "HALLMARK_UNFOLDED_PROTEIN_RESPONSE", go_id: "GO:0006986",
        file: "../human_treg_arthritis/00_data/references/msigdb_hallmark/HALLMARK_UNFOLDED_PROTEIN_RESPONSE.txt" }
    - { name: "HSR_core",                         go_id: "GO:0009408",
        file: "../human_treg_arthritis/00_data/references/temp_hsr_lens/HSR_core.txt" }
    - { name: "deCevins_STING_IFN_independent",   go_id: "GO:0140896",
        file: "../sting_positive_control/03_results/06_reference_axis/signatures/sting_specific_up.txt" }
    - { name: "IFN_axis_generic",                 go_id: "GO:0060337",
        file: "../sting_positive_control/03_results/06_reference_axis/signatures/ifn_only_up.txt" }

  # --- searched-and-absent proteostasis probe -----------------------------------
  # The project's central negative result is that no heat-shock program is in the arm.
  # An absence is only checkable if it is a row with a number, so every term a
  # proteostasis reading would predict is looked up by id and reported with its actual
  # gene count and q whether or not it passes anything. probe_name_pattern additionally
  # sweeps the enriched-term NAMES so a proteostasis-adjacent term nobody listed cannot
  # hide (it is how GO:0031649 heat generation surfaces).
  proteostasis_probe:
    - "GO:0009408"   # response to heat
    - "GO:0034605"   # cellular response to heat
    - "GO:0009266"   # response to temperature stimulus
    - "GO:0031649"   # heat generation
    - "GO:0006986"   # response to unfolded protein
    - "GO:0035966"   # response to topologically incorrect protein
    - "GO:0006457"   # protein folding
    - "GO:0042026"   # protein refolding
    - "GO:0006458"   # 'de novo' protein folding
    - "GO:0034975"   # protein folding in endoplasmic reticulum
    - "GO:0034976"   # response to endoplasmic reticulum stress
    - "GO:0030968"   # endoplasmic reticulum unfolded protein response
    - "GO:0006515"   # protein quality control for misfolded or incompletely synthesized protein
    - "GO:0010498"   # proteasomal protein catabolic process
    - "GO:0031072"   # heat shock protein binding        (MF)
    - "GO:0051082"   # unfolded protein binding          (MF)
    - "GO:0051087"   # protein-folding chaperone binding (MF)
    - "GO:0044183"   # protein folding chaperone         (MF)
  probe_name_pattern: "chaperon|unfolded|misfold|refold|protein folding|heat|thermogen|temperature|proteostas|proteasom|heat shock"

  # --- mouse-space replicate (secondary) ----------------------------------------
  # The same question asked before the ortholog map, so a term that appears only in human
  # space can be attributed to the projection rather than to the biology. Secondary by
  # construction: the human-space run is the one the arms are defined in.
  mouse_replicate:
    signature_object: "03_results/objects/17_signature_sets.rds"
    contrast: "WT_heat"
    direction: "up"
    gate: "fdr_logfc"
    universe: "03_results/objects/gene_universe.txt"
    orgdb: "org.Mm.eg.db"

  # --- display caps (figures only; every table carries every row) ---------------
  top_n_terms: 18             # rows in the per-arm ranked term bar
  top_n_blocks: 8             # term blocks drawn before the "other enriched" catch-all

